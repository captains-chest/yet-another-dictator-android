# Weekly version updates, proposed as pull requests. Security updates are enabled separately in
# the repository settings and are not limited by this schedule.
version: 2
updates:
  # gradle/libs.versions.toml and the Gradle wrapper. The sherpa-onnx AAR (app/build.gradle.kts) and
  # the models (scripts/model-manifest.txt) are pinned by SHA-256 and must be bumped by hand.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Copenhagen"
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      build-tools:
        patterns: ["com.android.*", "org.jlleitschuh.*"]
    commit-message:
      prefix: "chore(deps)"

  # Workflow actions are pinned to commit SHAs with a version comment; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Copenhagen"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
