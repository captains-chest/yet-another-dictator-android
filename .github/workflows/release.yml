name: Release

# On a v* tag: build a signed AAB (for Play) and a signed universal APK (for sideloading), attach
# both with their .sha256 files to a GitHub release, and upload the AAB to Play's internal track once CaptainDuckay has added a
# PLAY_SERVICE_ACCOUNT_JSON secret (skipped until then).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          # Play needs a strictly increasing code; the run number of this workflow always grows.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      # Fails before building, naming only the missing secrets (never their values).
      - name: Check signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets for release signing: ${missing[*]} (see README, Releases)"
            exit 1
          fi

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }
          echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Builds the AAB with Gradle and the universal APK from it with bundletool, both signed.
      - name: Signed AAB and universal APK
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          scripts/build-universal-apk.sh
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/dictator-android-$VERSION_NAME.aab"
          cp build/dictator-universal.apk "dist/dictator-android-$VERSION_NAME.apk"
          # apksigner verify (v2+, not a debug key) and a .sha256 next to each file.
          scripts/verify-signed-apk.sh "dist/dictator-android-$VERSION_NAME.apk" "dist/dictator-android-$VERSION_NAME.aab"
          ls -l dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION_NAME" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          prerelease=""
          [[ "$VERSION_NAME" == 0.* || "$VERSION_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Dictator for Android $VERSION_NAME" --notes-file notes.md $prerelease

      # Draft on the internal track: a new Play app only accepts draft releases until its first
      # review. Roll it out to testers in Play Console.
      - name: Upload to Google Play (internal track)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.captainduckay.dictator.android
          releaseFiles: dist/dictator-android-${{ env.VERSION_NAME }}.aab
          track: internal
          status: draft

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
