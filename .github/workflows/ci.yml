name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  check:
    name: Test, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # The ported DictationCore tests and the app's unit tests. The model is not fetched here.
      - name: Unit tests
        run: ./gradlew test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android lint
        run: ./gradlew lint

      - name: Debug APK (no model)
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7

  release:
    name: Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # Unsigned here (no secrets on pull requests); signed builds come from the Release workflow.
      # The model is downloaded after install (ADR 0006), so the whole AAB stays small.
      - name: Release AAB
        run: |
          ./gradlew bundleRelease
          aab=app/build/outputs/bundle/release/app-release.aab
          base=$(unzip -l "$aab" | awk '$4 ~ /^base\// {s += $1} END {print s}')
          echo "base module: $base bytes"
          # sherpa-onnx adds ~32 MB native code per ABI (ADR 0008); still far under Play's 200 MB limit.
          test "$base" -lt 100000000

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictator-android-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          compression-level: 0
